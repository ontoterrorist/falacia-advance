* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background: var(--desk); color: var(--shell-ink);
  font-family: var(--fb); font-size: 22px; line-height: 1.15; overflow: hidden;
}
button { font: inherit; color: inherit; }

:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }

/* ---------- consola ---------- */
.gba {
  width: 100%; max-width: 1320px; height: 100%; max-height: 880px;
  display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 4px;
  padding: 16px 6px 22px 18px; background: var(--shell);
  border-radius: 30px 30px 54px 30px;
  box-shadow: inset 0 5px 0 0 var(--shell-hi), inset 0 -9px 0 0 var(--shell-lo), inset -5px 0 0 0 var(--shell-lo), 0 12px 0 0 rgba(0, 0, 0, .4);
}
.bezel {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  padding: 26px 14px 14px; background: var(--bezel); border-radius: 14px 14px 26px 14px;
  box-shadow: 0 3px 0 0 var(--shell-hi);
}
.btop { position: absolute; top: 7px; left: 18px; right: 18px; display: flex; align-items: center; gap: 10px; color: var(--shell-ink); }
.led { width: 9px; height: 9px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 6px 1px var(--pri); }
.brand { font-family: var(--fd); font-size: 9px; letter-spacing: .14em; }
.brand b { font-weight: 400; color: var(--hi); }
.snd { margin-left: auto; border: 0; background: none; padding: 2px 6px; font-family: var(--fd); font-size: 10px; color: var(--shell-ink); cursor: pointer; }
.snd.off { opacity: .4; text-decoration: line-through; }

.screen {
  flex: 1; min-width: 0; min-height: 0; overflow: hidden; position: relative; border-radius: 3px;
  display: flex; flex-direction: column; gap: .45em; padding: .55em;
  color: var(--ink); font-size: 22px; line-height: 1.08;
  /* los fondos son tres dibujos de PixelLab (art/fondo-a|b|c.png, tools/fondo.py), a todo color; el color del mundo queda
     debajo por si no cargan y en las fichas y los cuadros. game.js fija --bgs: la menor escala (en medios píxeles) que cubre la pantalla */
  background-color: var(--bg);
  background-image: var(--fondo-a);
  background-size: var(--bgs, cover); background-position: center bottom; background-repeat: no-repeat;
  image-rendering: pixelated;
}
/* a: cielo de constelaciones (casi todo) · c: islas con templos unidas por puentes, para la Aventura · b: diagramas de Venn, para el sabio */
.screen.t-map, .screen.t-w1, .screen.t-w2, .screen.t-w3, .screen.t-w4 { background-image: var(--fondo-c); }
.screen.t-sage { background-image: var(--fondo-b); }
.screen > * { animation: enter .16s steps(3); }
@keyframes enter { from { opacity: 0; transform: translateY(.3em); } }
.screen.shake { animation: shake .3s steps(4); }
#fx { position: absolute; inset: 26px 14px 14px; pointer-events: none; overflow: hidden; z-index: 15; }
#fx .p { position: absolute; width: 9px; height: 9px; animation: part .75s steps(9) forwards; }
@keyframes part { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
#toast {
  position: absolute; top: 4px; left: 50%; z-index: 20; max-width: 96%; white-space: nowrap;
  display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px;
  background: var(--hi); color: var(--line); font-family: var(--fs); font-size: 21px; line-height: 1.05;

}

@keyframes toast { 0% { transform: translate(-50%, -140%); } 8%, 90% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -160%); } }

.pad { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 4px; color: var(--shell-ink); min-height: 0; }
.pad button { border: 0; padding: 0; cursor: pointer; background: var(--key); color: var(--key-ink); font-family: var(--fd); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.pad button:active, .pad button.pressed { transform: translateY(3px); box-shadow: none; }
.shoulders { display: flex; gap: 12px; }
.sh { width: 86px; height: 34px; border-radius: 12px 12px 6px 6px; font-size: 11px; box-shadow: 0 4px 0 0 var(--key-lo); }
.dpad { position: relative; width: 132px; height: 132px; flex: none; filter: drop-shadow(0 4px 0 var(--key-lo)); }
.dpad::before { content: ''; position: absolute; left: 44px; top: 44px; width: 44px; height: 44px; background: var(--key); }
.dpad::after { content: ''; position: absolute; left: 58px; top: 58px; width: 16px; height: 16px; border-radius: 50%; background: var(--key-lo); opacity: .55; }
.dpad button { position: absolute; width: 44px; height: 44px; }
.dpad .up { left: 44px; top: 0; border-radius: 9px 9px 0 0; }
.dpad .down { left: 44px; top: 88px; border-radius: 0 0 9px 9px; }
.dpad .left { left: 0; top: 44px; border-radius: 9px 0 0 9px; }
.dpad .right { left: 88px; top: 44px; border-radius: 0 9px 9px 0; }
.dpad button::after { content: ''; position: absolute; left: 50%; top: 50%; border: 7px solid transparent; }
.dpad .up::after { border-bottom-color: var(--key-ink); transform: translate(-50%, -80%); }
.dpad .down::after { border-top-color: var(--key-ink); transform: translate(-50%, -20%); }

.dpad .right::after { border-left-color: var(--key-ink); transform: translate(-20%, -50%); }
.dpad button:active, .dpad button.pressed { transform: none; filter: brightness(.75); }
.ab { position: relative; width: 156px; height: 104px; flex: none; }
.rb { position: absolute; width: 62px; height: 62px; border-radius: 50%; font-size: 15px; box-shadow: 0 5px 0 0 var(--key-lo); }
.pad .rb.a { right: 4px; top: 0; background: var(--pri); color: #fff6e0; box-shadow: 0 5px 0 0 var(--pri-lo); }
.rb.b { left: 4px; bottom: 0; }
.ss { display: flex; gap: 18px; font-family: var(--fd); font-size: 7px; letter-spacing: .08em; }

.ss button { width: 54px; height: 16px; border-radius: 8px; box-shadow: 0 3px 0 0 var(--key-lo); }
.legend { min-height: 5.2em; font-size: 17px; line-height: 1.15; text-align: center; text-wrap: balance; }
.legend b { font-family: var(--fs); font-size: 1em; font-weight: 400; letter-spacing: .04em; color: var(--hi); }
.speaker { width: 96px; height: 40px; flex: none; background-image: radial-gradient(circle, var(--shell-lo) 3px, transparent 3.5px); background-size: 16px 13px; }

/* ---------- piezas de la pantalla ---------- */
.screen b, .screen strong { font-family: var(--fs); font-weight: 400; font-size: .97em; letter-spacing: .02em; }
.pd { font-family: var(--fd); font-size: .5em; line-height: 1.6; letter-spacing: .04em; }

.grow { flex: 1 1 auto; min-height: 0; }
.scroll { position: relative; overflow-y: auto; scrollbar-width: none; min-height: 0; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.panel { background: var(--panel); margin: var(--b); padding: .5em .7em; box-shadow: var(--ol), inset 0 calc(-1 * var(--b)) 0 0 var(--panel-lo); }
.px { display: block; image-rendering: pixelated; }
.more { position: absolute; right: .9em; bottom: .7em; z-index: 6; font-family: var(--fs); font-size: .8em; background: var(--panel); padding: 0 .3em; color: var(--pri); animation: blink 1s steps(1) infinite; pointer-events: none; }

.hud { display: flex; align-items: center; gap: .5em; margin: var(--b); padding: .22em .5em; background: var(--panel); box-shadow: var(--ol); flex: none; min-height: 1.85em; }
.chip { font-family: var(--fs); font-size: .86em; line-height: 1; letter-spacing: .05em; padding: .16em .5em .2em; background: var(--wc); color: var(--line); box-shadow: 0 0 0 2px var(--line); white-space: nowrap; }

/* elementos elegibles: opciones, entradas de menú, filas */
.opt {

  background: var(--btn); color: var(--ink); font-family: var(--fs); line-height: 1; cursor: pointer;
  box-shadow: var(--ol), inset calc(-1 * var(--b)) calc(-1 * var(--b)) 0 0 var(--btn-lo);
}

.opt.sel { background: var(--hi); --btn-lo: var(--hi-lo); transform: translate(-2px, -2px); box-shadow: var(--ol), inset calc(-1 * var(--b)) calc(-1 * var(--b)) 0 0 var(--btn-lo), 5px 5px 0 0 rgba(0, 0, 0, .35); }

.list > * { flex: none; }

/* robot */
.who { flex: none; width: 4.6em; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.bot { position: relative; display: block; width: 100%; aspect-ratio: 1; animation: bob 1.2s steps(2) infinite; }
.bot img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.bot.a-hop { animation: hop .5s steps(2) infinite; }
.bot.a-tilt { animation: tilt 2.2s steps(2) infinite; transform-origin: 50% 90%; }
.bot.a-fast { animation: bob .5s steps(2) infinite; }
.bot.a-slow { animation: bob 2.2s steps(2) infinite; }
.bot.a-shake { animation: shk .2s steps(2) infinite; }
.bot.a-wobble { animation: wob 1.4s steps(4) infinite; transform-origin: 50% 90%; }
.bot.a-nod { animation: nod 1.6s steps(2) infinite; }
.bot.a-no { animation: shk .9s steps(2) infinite; }
.bot .bl, .bot .mt, .bot .sw, .bot .bw, .bot .mm { visibility: hidden; }
.bot .sw { animation: swy 2s steps(1) infinite; }
.bot .bw { animation: brw 3.8s steps(1) infinite; }
.bot .mm { animation: mum 3.2s steps(1) infinite; }
.bot.sage .bl { animation: blk 4.4s steps(1) infinite; }
.bot.bk .bl { animation: blk 4.4s steps(1) infinite; }
.bot.bk .ey { animation: eyh 4.4s steps(1) infinite; }
.bot.talk .mt { animation: von .24s steps(1) infinite; }
.bot.talk .mo { animation: voff .24s steps(1) infinite; }
.bot .alarm { animation: blink .4s steps(1) infinite; }
.bot .tw { animation: blink .6s steps(1) infinite; }
.bot .tw.d2 { animation-delay: .3s; }
.bot .fl { animation: flt 1.6s steps(8) infinite; }
.bot .fl.d2 { animation-delay: .8s; }
.bot .drip { animation: drip 1s steps(4) infinite; }
.bot .drip.d2 { animation-delay: .5s; }
.bot .bobx { animation: bobx .8s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-3%); } }
@keyframes bobx { 50% { transform: translateY(-2%); } }
@keyframes hop { 50% { transform: translateY(-7%); } }
@keyframes tilt { 50% { transform: rotate(-5deg); } }
@keyframes shk { 50% { transform: translateX(3%); } }
@keyframes wob { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes nod { 50% { transform: translateY(3%); } }
@keyframes swy { 0% { visibility: hidden; } 50%, 100% { visibility: visible; } }
@keyframes brw { 0% { visibility: hidden; } 58% { visibility: visible; } 72%, 100% { visibility: hidden; } }
@keyframes mum { 0%, 12%, 24% { visibility: visible; } 6%, 18%, 30%, 100% { visibility: hidden; } }
@keyframes blk { 0%, 93% { visibility: hidden; } 94%, 100% { visibility: visible; } }
@keyframes eyh { 0%, 93% { visibility: visible; } 94%, 100% { visibility: hidden; } }
@keyframes von { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes voff { 0% { visibility: hidden; } 50% { visibility: visible; } }
@keyframes flt { 0% { transform: translateY(4%); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-6%); opacity: 0; } }
@keyframes drip { 0% { transform: translateY(-2%); opacity: 1; } 100% { transform: translateY(7%); opacity: 0; } }
@keyframes blink { 50% { opacity: .2; } }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.blink { animation: blink 1.1s steps(1) infinite; }

.bubble { position: relative; flex: 1; min-width: 0; background: var(--panel); margin: var(--b); padding: .42em .7em; box-shadow: var(--ol); }

/* ---------- portada ---------- */

  text-shadow: .1em 0 var(--line), -.1em 0 var(--line), 0 .1em var(--line), 0 -.1em var(--line), .1em .1em var(--line), -.1em -.1em var(--line), .1em -.1em var(--line), -.1em .1em var(--line), .22em .22em 0 var(--line); }

.lesson { font-size: 1.08em; }

/* ---------- sabio ---------- */
.bot.sage { width: 4.6em; float: left; margin: 0 .65em .3em 0; }
.narrow .bot.sage { width: 3.6em; }
.say .ttl { font-family: var(--fs); font-size: 1.3em; line-height: 1; margin-bottom: .3em; color: var(--pri); }
.say p { margin: 0 0 .5em; }
.say p i { color: var(--ink2); }
.say::after { content: ''; display: block; clear: both; }
.say { font-size: 1.05em; }
.done { color: var(--ok); }

/* ---------- falacidex ---------- */
.dex { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: .4em; }
.dex .opt { min-height: 0; padding: .16em .5em; font-size: .96em; }
.dex .opt.no { color: var(--ink2); }
.hdr { margin: .5em .3em .15em; font-family: var(--fs); font-size: .88em; letter-spacing: .08em; }
.hdr:first-child { margin-top: .3em; }
.narrow .dex { grid-template-columns: minmax(0, 1fr); }
.narrow .dex .detail { display: none; }

/* ---------- perfil ---------- */
.prof { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: .5em; }
.gal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em; min-width: 0; }
.gal .who { width: 7.6em; }
.moodn { font-family: var(--fs); font-size: 1.05em; text-align: center; line-height: 1.1; letter-spacing: .05em; }
.achs { display: grid; grid-template-columns: 1fr 1fr; gap: .3em .7em; }
.ach { display: flex; gap: .4em; align-items: baseline; opacity: .45; }
.ach.on { opacity: 1; }
.ach .tr { color: var(--hi-lo); font-family: var(--fs); }
.ach small { display: block; color: var(--ink2); font-size: .82em; }
.stat { display: flex; justify-content: space-between; gap: 1em; }
.narrow .prof { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.narrow .gal { flex-direction: row; }
.narrow .gal .who { width: 4.4em; }
.narrow .achs { grid-template-columns: 1fr; }

/* ---------- opciones ---------- */
.vm { display: flex; gap: .16em; align-items: flex-end; }
.vm i { width: .36em; background: var(--btn-lo); box-shadow: 0 0 0 2px var(--line); }
.vm i:nth-child(1) { height: .4em; } .vm i:nth-child(2) { height: .55em; } .vm i:nth-child(3) { height: .7em; } .vm i:nth-child(4) { height: .85em; } .vm i:nth-child(5) { height: 1em; }
.vm i.on { background: var(--pri); }

/* ---------- resultado ---------- */
.res { flex: none; display: flex; align-items: center; justify-content: center; gap: .8em; }
.res .who { width: 5.4em; }
.bigstars { font-size: 2.3em; line-height: 1; letter-spacing: .12em; }
.bigstars i { display: inline-block; color: rgba(14, 13, 31, .5); }
.bigstars i.on { color: var(--hi); text-shadow: .05em .05em 0 var(--line), -.05em -.05em 0 var(--line), .05em -.05em 0 var(--line), -.05em .05em 0 var(--line); animation: pop .4s steps(4) both; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: .1em .3em; flex: none; }
.duo .opt { justify-content: center; text-align: center; }

/* ---------- relámpago ---------- */
.timer { flex: 1; min-width: 0; height: .6em; background: rgba(14, 13, 31, .3); box-shadow: 0 0 0 2px var(--line); }
.timer i { display: block; height: 100%; width: 100%; background: var(--ok-bg); }
.timer.low i { background: var(--bad-bg); }
.fl2 .opt { min-height: 2.5em; font-size: 1.15em; }
.fl2 .opt kbd { font-family: var(--fs); font-size: .8em; padding: .05em .4em; }
.verdict { flex: none; margin: var(--b); padding: .3em .6em; min-height: 1.9em; font-family: var(--fs); box-shadow: var(--ol); background: var(--panel); }
.verdict.good { background: var(--ok-bg); }
.verdict.bad { background: var(--bad-bg); }

/* ---------- ventana estrecha o celular en vertical: el mando pasa debajo de la pantalla ---------- */
@media (max-width: 860px) and (min-height: 521px) {
  body { font-size: 20px; padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .gba { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; max-height: none; padding: 10px 10px 16px; border-radius: 18px 18px 30px 30px; }
  .bezel { padding: 22px 6px 6px; border-radius: 10px; }
  #fx { inset: 22px 6px 6px; }
  .btop { top: 5px; }
  .pad { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "dpad sh ab" "dpad ss ab"; align-items: center; justify-items: center; gap: 4px 8px; padding: 6px 2px 0; }
  .shoulders { grid-area: sh; gap: 8px; }
  .sh { width: 56px; height: 28px; }
  .dpad { grid-area: dpad; width: 108px; height: 108px; }
  .dpad::before { left: 36px; top: 36px; width: 36px; height: 36px; }
  .dpad::after { left: 46px; top: 46px; }
  .dpad button { width: 36px; height: 36px; }
  .dpad .up, .dpad .down { left: 36px; }
  .dpad .down { top: 72px; }
  .dpad .left, .dpad .right { top: 36px; }
  .dpad .right { left: 72px; }
  .ab { grid-area: ab; width: 124px; height: 92px; }
  .rb { width: 54px; height: 54px; }
  .ss { grid-area: ss; gap: 10px; }
  .ss button { width: 44px; }
  .legend, .speaker { display: none; }
}
@media (max-width: 520px) and (min-height: 521px) {
  body { padding: max(4px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(4px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .gba { padding: 7px 7px 12px; border-radius: 14px 14px 24px 24px; }
  .bezel { padding: 20px 4px 4px; border-radius: 8px; }
  #fx { inset: 20px 4px 4px; }
  .pad { gap: 4px 6px; padding: 6px 0 0; }
  .shoulders { gap: 6px; }
  .sh { width: 48px; }
  .dpad { width: 96px; height: 96px; }
  .dpad::before { left: 32px; top: 32px; width: 32px; height: 32px; }
  .dpad::after { left: 40px; top: 40px; }
  .dpad button { width: 32px; height: 32px; }
  .dpad .up, .dpad .down { left: 32px; }
  .dpad .down { top: 64px; }
  .dpad .left, .dpad .right { top: 32px; }
  .dpad .right { left: 64px; }
  .ab { width: 110px; height: 84px; }
  .rb { width: 50px; height: 50px; }
  .ss { gap: 6px; }
  .ss button { width: 40px; }
  #toast { font-size: 17px; }
}
@media (max-height: 620px) and (min-width: 861px) {
  .speaker { display: none; }
  .legend { font-size: 15px; min-height: 0; }
  .dpad { transform: scale(.86); margin-block: -8px; }
  .ab { transform: scale(.86); margin-block: -6px; }
}
/* celular apaisado (o ventana muy baja): mando a la derecha, compacto */
@media (max-height: 520px) {
  body { font-size: 20px; padding: max(4px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(4px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .gba { grid-template-columns: minmax(0, 1fr) 150px; gap: 2px; padding: 6px 2px 10px 8px; border-radius: 16px 16px 26px 16px; }
  .bezel { padding: 18px 5px 5px; border-radius: 8px; }
  #fx { inset: 18px 5px 5px; }
  .btop { top: 3px; }
  .brand { font-size: 7px; }
  .pad { padding: 0 2px; gap: 2px; }
  .shoulders { gap: 6px; }
  .sh { width: 58px; height: 22px; font-size: 9px; }
  .dpad { width: 96px; height: 96px; transform: none; margin: 0; }
  .dpad::before { left: 32px; top: 32px; width: 32px; height: 32px; }
  .dpad::after { left: 40px; top: 40px; }
  .dpad button { width: 32px; height: 32px; }
  .dpad .up, .dpad .down { left: 32px; }
  .dpad .down { top: 64px; }
  .dpad .left, .dpad .right { top: 32px; }
  .dpad .right { left: 64px; }
  .ab { width: 116px; height: 78px; transform: none; margin: 0; }
  .rb { width: 50px; height: 50px; font-size: 13px; }
  .ss { gap: 8px; font-size: 6px; }
  .ss span { gap: 4px; }
  .ss button { width: 40px; height: 12px; }
  .legend, .speaker { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .bot, .bot *, .blink, .screen > *, .screen.shake, .opt, .foe .boss, .pips i, .hrt, .bigstars i, #fx .p { animation: none !important; }
  .bot .bl, .bot .mt, .bot .sw, .bot .bw, .bot .mm { visibility: hidden !important; }
}

 // ---- formales
 afirm_consec:{n:'Afirmación del consecuente',f:'formal',

 neg_conj:{n:'Negación de una conjunción',f:'formal',

  ce:'No puedes estar en Santiago y en Lima a la vez. ∴ No estás en Santiago ni en Lima. (¡Estás en Santiago!)'},
 medio_no_dist:{n:'Término medio no distribuido',f:'formal',
  d:'El término común a las dos premisas nunca se toma entero: los A están dentro de B y los C están dentro de B, pero nadie dijo que compartan un solo punto. Dos islas en el mismo mar.',

 proceso_ilicito:{n:'Proceso ilícito',f:'formal',

 modal:{n:'Falacia modal',f:'formal',

 inv_cuant:{n:'Inversión de cuantificadores',f:'formal',

 // ---- relevancia
 ad_hominem:{n:'Ad hominem',f:'relev',

 tu_quoque:{n:'Tu quoque / whataboutism',f:'relev',

Q(1,'afirm_consec',`Si hubiera estudiado, habría aprobado.\nAprobó.\n∴ Estudió.`,`Estudiar BASTA para aprobar, pero no es lo único que sirve: pudo copiar, tener suerte o saberlo de antes.`);
Q(1,'afirm_consec',`Si tiene gripe, tendrá fiebre.\nTiene fiebre.\n∴ Tiene gripe.`,`La fiebre llega por muchas puertas: otras infecciones, un golpe de calor, una inflamación…`);
Q(1,'afirm_consec',`Si nos estuvieran ocultando algo, habría contradicciones en la versión oficial.\nHay contradicciones.\n∴ Nos están ocultando algo.`,`Las versiones oficiales se contradicen también por errores, prisas y datos que cambian.`);
Q(1,'neg_antec',`Si llueve, la calle se moja.\nNo llovió.\n∴ La calle está seca.`,`Contraejemplo instantáneo: pasó el camión regador.`);

Q(1,'neg_conj',`No es cierto que sea rico y famoso.\n∴ No es rico y tampoco es famoso.`,`Puede ser riquísimo y desconocido. Solo sabemos que al menos una de las dos cosas falla.`);
Q(1,'medio_no_dist',`Todos los perros son mamíferos.\nTodos los gatos son mamíferos.\n∴ Todos los gatos son perros.`,`«Mamífero» nunca se toma entero: perros y gatos son dos islas en el mismo mar.`);
Q(1,'medio_no_dist',`Todos los terroristas usan teléfono encriptado.\nTodos los periodistas de investigación usan teléfono encriptado.\n∴ Todos los periodistas de investigación son terroristas.`,`Lo que tienen en común es el teléfono, y nunca se habló de TODOS los que lo usan. Es el esquema «los malos hacen X; estos hacen X; luego son malos».`);
Q(1,'proceso_ilicito',`Todos los que evaden impuestos son deshonestos.\nNinguno de nuestros socios evade impuestos.\n∴ Ninguno de nuestros socios es deshonesto.`,`Hay otras formas de ser deshonesto: de los evasores se dijo algo, de los deshonestos en general no.`);
Q(3,'equivocacion',`Nada es mejor que la felicidad eterna.\nUn sándwich es mejor que nada.\n∴ Un sándwich es mejor que la felicidad eterna.`,`«Nada» significa «ninguna cosa» en (1) y «no tener nada» en (2): la palabra cambia de sentido entre una premisa y la otra.`);
Q(1,'modal',`Necesariamente, si Dios sabe que mañana mentirás, mañana mentirás.\nDios lo sabe.\n∴ Mañana mentirás necesariamente.`,`Lo necesario es el vínculo (saber→ocurrir), no el hecho. Solo se sigue «mentirás», no «necesariamente».`);
Q(1,'inv_cuant',`Todo el mundo ama a alguien.\n∴ Hay alguien a quien todo el mundo ama.`,`Cada persona puede amar a alguien distinto. El orden de los cuantificadores cambia quién depende de quién.`);
Q(1,'ok',`Si es feriado, el banco cierra.\nEs feriado.\n∴ El banco está cerrado.`,`Es modus ponens: afirmar el antecedente y concluir el consecuente es la forma válida.`);
Q(1,'ok',`Si es feriado, el banco cierra.\nEl banco está abierto.\n∴ No es feriado.`,`Es modus tollens: negar el consecuente permite negar el antecedente. Válido.`);

Q(2,'ad_hominem',`Einstein abandonó a su primera mujer.\n∴ La teoría de la relatividad no puede ser correcta.`,`La vida privada de Einstein no cambia la probabilidad de que la teoría sea verdadera.`);
Q(2,'ad_hominem',`Claro que defiende el impuesto: él no lo paga.\n∴ Su argumento no vale nada.`,`Variedad circunstancial: apuntar al interés de quien habla no refuta lo que dice (a lo sumo pide revisar con más cuidado).`);
Q(2,'tu_quoque',`Usted dice que hay que ahorrar agua, pero tiene piscina.\n∴ Su argumento no vale.`,`La hipocresía no vuelve falsa la conclusión: el agua igual hay que ahorrarla.`);
Q(2,'tu_quoque',`—Su gobierno censuró tres medios.\n—¿Y el gobierno anterior, que censuró cinco?`,`Puede ser verdad que el anterior censurara cinco, pero eso no responde nada sobre los tres.`);

Q(2,'autoridad',`Un actor muy famoso dice que las vacunas alteran el ADN.\n∴ Las vacunas alteran el ADN.`,`La fama no es experticia en genética: la experticia no se transfiere entre campos.`);

Q(2,'populum',`La homeopatía lleva siglos usándose.\n∴ Algo de verdad tendrá.`,`Es la variedad ad antiquitatem: que algo sea antiguo no prueba que funcione.`);
Q(2,'baculum',`Naturalmente, usted es libre de votar como quiera.\nSolo recuerde quién decide los turnos el mes que viene.`,`Amenaza envuelta en cortesía: el daño anunciado no tiene nada que ver con la verdad de lo votado.`);
Q(2,'misericordia',`Si me reprueba pierdo la beca y mi madre está enferma.\n∴ Mis respuestas estaban bien: revise mi nota.`,`Una situación dolorosa no es evidencia de que las respuestas fueran correctas.`);
Q(2,'ignorantiam',`Nadie ha demostrado que los fantasmas no existan.\n∴ Existen.`,`La ausencia de prueba en contra no es prueba a favor: quien afirma carga con la prueba.`);

Q(2,'consecuencias',`Si el cambio climático fuera irreversible, todo lo que hacemos sería inútil.\n∴ No puede ser irreversible.`,`Que una conclusión nos desanime no la hace falsa: el clima no negocia.`);
Q(2,'paja',`—Creo que deberíamos revisar el presupuesto de Defensa.\n—O sea que quieres dejar el país indefenso.`,`Nadie propuso dejar el país indefenso: se refuta a un muñeco.`);
Q(2,'pista_falsa',`—¿Por qué se perdieron los fondos del programa?\n—Lo importante es el enorme esfuerzo de nuestros funcionarios, que trabajan de sol a sol.`,`El esfuerzo puede ser real, pero no responde la pregunta: la reemplaza.`);
Q(2,'ok',`Este informe sobre azúcar lo financió una empresa de bebidas.\n∴ Hay que leerlo con mucho cuidado.`,`Un conflicto de interés justifica REVISAR con más cuidado, no descartar: no concluye que sea falso.`);

Q(2,'ok',`Revisamos el expediente completo y no aparece ninguna firma suya.\n∴ Probablemente no lo autorizó.`,`Ausencia de evidencia donde DEBERÍA haberla, tras una búsqueda capaz de encontrarla: sí apoya.`);
Q(2,'ok',`Esta ley dejaría sin techo a diez mil personas.\n∴ No deberíamos aprobarla.`,`La conclusión es sobre qué HACER: ahí las consecuencias son justamente lo que se discute.`);
Q(2,'ok',`Este testigo ha mentido bajo juramento en tres juicios.\n∴ Su declaración merece desconfianza.`,`Cuando lo que está en juego es un TESTIMONIO, la credibilidad de quien declara sí es relevante.`);

Q(3,'equivocacion',`El fin de una cosa es su perfección.\nLa muerte es el fin de la vida.\n∴ La muerte es la perfección de la vida.`,`«Fin» significa «propósito» en (1) y «término» en (2).`);

/* Falacia Advance — versiones del modo Relámpago.
   Cada lista tiene exactamente 100 ejemplos: los de la Aventura de esa parte del curso más los de aquí,
   que solo salen en Relámpago (por eso no llevan explicación). k: clave de la falacia, u «ok» si el argumento es bueno.
   Reglas de estilo: el término medio no distribuido va siempre con universales («Todos los A son B. Todos los C son B.
   ∴ Todos los C son A») y el proceso ilícito con un universal afirmativo y dos negativos («Todos los A son B.
   Ningún C es A. ∴ Ningún C es B»). */

function burst(el, colors) {
  if (!el) return;
  const r = el.getBoundingClientRect(), f = fxEl.getBoundingClientRect();
  const cx = r.left + r.width / 2 - f.left, cy = r.top + r.height / 2 - f.top;
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'), a = Math.random() * 6.283, d = 50 + Math.random() * 110;
    p.className = 'p';
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i % colors.length]};--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d - 40)}px`;
    fxEl.appendChild(p);
    setTimeout(() => p.remove(), 800);

/* el argumento: premisas numeradas, conclusión con ∴; cada letra en su <i> para escribirlo poco a poco */
function argHTML(t, plain) {
  const L = t.split(NL), multi = L.length > 1;
  const wrap = s => plain ? esc(s) : [...s].map(c => c === ' ' ? ' ' : '<i class="h">' + esc(c) + '</i>').join('');
  let n = 0;
  return L.map(l => {
    if (l.startsWith('∴')) return `<div class="sep"></div><div class="line con"><span class="pn">∴</span><span class="pt">${wrap(l.replace(/^∴\s*/, ''))}</span></div>`;
    if (multi && !l.startsWith('—')) return `<div class="line"><span class="pn">(${++n})</span><span class="pt">${wrap(l)}</span></div>`;
    return `<div class="line"><span class="pt">${wrap(l)}</span></div>`;
  }).join('');
}

/* el tamaño de letra de la pantalla sale del espacio disponible; «narrow» pasa todo a una columna */
function fit() {
  const w = app.clientWidth, h = app.clientHeight;
  if (w < 50 || h < 50) return;
  const fs = Math.max(15, Math.min(w < h ? w / 20.5 : w / 37, h / 19.6, 30));   // en vertical, letra más grande y una sola columna
  app.style.fontSize = fs.toFixed(2) + 'px';
  /* el fondo a la menor escala (en pasos de medio píxel) que cubre la pantalla: los píxeles salen parejos o alternan de forma regular */
  const k = Math.max(1, Math.ceil(2 * Math.max(w / FONDO.w, h / FONDO.h)) / 2);
  app.style.setProperty('--bgs', `${Math.round(FONDO.w * k)}px ${Math.round(FONDO.h * k)}px`);
  app.classList.toggle('narrow', w / fs < 30);
}
function hl() {
  const els = SEL();
  els.forEach(e => e.classList.toggle('sel', +e.dataset.i === V.idx));
  const e = els.find(x => +x.dataset.i === V.idx);
  if (e) {
    const sc = e.closest('.scroll');
    if (sc) {
      const a = e.offsetTop, b = a + e.offsetHeight;
      if (a - 8 < sc.scrollTop) sc.scrollTop = a - 8;
      else if (b + 8 > sc.scrollTop + sc.clientHeight) sc.scrollTop = b - sc.clientHeight + 8;
    }
  }

}
function more() {
  const s = app.querySelector('.panel.scroll');
  const chk = () => {
    const o = app.querySelector('.more'); if (o) o.remove();
    if (s && s.scrollHeight > s.clientHeight + 6 && s.scrollTop + s.clientHeight < s.scrollHeight - 6) {
      const m = document.createElement('div'); m.className = 'more'; m.textContent = '▼ MÁS';
      const r = s.getBoundingClientRect(), a = app.getBoundingClientRect();
      m.style.right = (a.right - r.right + 10) + 'px'; m.style.bottom = (a.bottom - r.bottom + 8) + 'px';
      app.appendChild(m);

}
function legend() {

function cols() {
  const els = SEL();
  if (els.length < 2) return 1;
  /* offsetTop y no la caja dibujada: la casilla elegida se pinta unos píxeles desplazada */
  const t = els[0].offsetTop;
  let c = 0;
  for (const e of els) { if (e.offsetTop === t) c++; else break; }
  return Math.max(1, c);
}
function nav(b) {
  const n = V.n;
  if (n < 2) return false;
  const c = cols();
  let i = V.idx;
  if (c === 1) {
    if (b === 'up') i = (i + n - 1) % n; else if (b === 'down') i = (i + 1) % n; else return false;
  } else {
    if (b === 'up') i -= c; else if (b === 'down') i += c; else if (b === 'left') i -= 1; else i += 1;
    if (i < 0 || i >= n) return true;
  }
  if (i !== V.idx) { V.idx = i; AU.sfx.move(); hl(); }
  return true;
}
const DIRS = ['up', 'down', 'left', 'right'];
function press(b) {

function startRun(mode, w, sub) {
  let pool, n, hp, label, th, sg;
  if (mode === 'adv') { pool = QS.filter(q => q.w === w); n = 12; hp = 5; label = 'MUNDO ' + w; th = 'w' + w; sg = 'w' + w; }
  else if (mode === 'tor') { const t = torneo(sub); sub = t.id; pool = torPool(t); n = 15; hp = 3; label = 'TORNEO · ' + t.n; th = 'tor'; sg = 'quiz'; }
  else { pool = BOSS; n = 6; hp = 3; label = 'JEFE'; th = 'boss'; sg = 'boss'; }
  let q;
  if (mode === 'boss') q = BOSS.slice();
  else if (window.FA_QUEUE) q = window.FA_QUEUE.map(id => QS.find(x => x.id === id));   // partida prefijada (video promocional)
  else {
    /* primero lo que más se falla, luego lo que aún no se ha visto */
    const pr = x => { const s = S.qs[x.id]; return (s ? (s[1] > s[0] ? 0 : 2) : 1) + Math.random() * 0.9; };
    const sorted = pool.slice().sort((a, b) => pr(a) - pr(b));
    q = sorted.slice(0, n);
    const oks = sorted.filter(x => x.k === 'ok' && !q.includes(x));
    for (let i = q.length - 1; i >= 0 && q.filter(x => x.k === 'ok').length < 2 && oks.length; i--) if (q[i].k !== 'ok') q[i] = oks.shift();
    q = shuffle(q);
  }
  run = { mode, w, sub, label, theme: th, song: sg, queue: q, res: [], i: 0, hearts: hp, max: hp, score: 0, streak: 0, best: 0, right: 0, wrong: 0, missed: [], retried: {}, newc: 0, ach: [], fifty: mode === 'boss' ? 1 : 2, noRetry: mode === 'boss', key: mode === 'adv' ? 'w' + w : mode, hp: 6 };
  ask();
}
function mkOpts(q) {
  const pool = shuffle(DEX.filter(k => FAL[k].f === q.fam && k !== q.k));
  const o = q.k === 'ok' ? pool.slice(0, 3) : shuffle([q.k, ...pool.slice(0, 2)]);
  return [...o, 'ok'];
}
function ask() {
  run.cur = run.queue[run.i];

}

const tipText = () => V.hinted ? `<b>PISTA</b> ${HINT[run.cur.fam]}` : `<b>SELECT</b> pista (−50) · <b>R</b> 50/50 (${run.fifty}) · <b>START</b> pausa`;

R.clases = () => {
  V.n = CLASES_DEF.length;
  return `<div class="hud"><span class="chip">CLASES</span><span class="ttl">El Sabio Barbonio</span><span class="pts">${Object.keys(S.units).length}/${CLASES_DEF.length}</span></div>
  <div class="panel say" style="flex:none">${SP.sage('happy')}<p>Bienvenido, joven. Mi barba tiene dos mil años de lógica. ¿Qué lección quieres hoy?</p></div>
  <div class="list scroll grow">${listHTML(CLASES_DEF.map((c, i) => [c.n, `${c.sub} · ${unitPages(i).length} páginas`, S.units[i] ? '<span class="end done">✔</span>' : '']))}</div>`;
};
H.clases = { A() { AU.sfx.ok(); AU.sfx.sage(); go('clase', { u: V.idx, pg: 0 }); }, B: backMenu };
R.clase = () => {
  const U = CLASES_DEF[V.u], P = unitPages(V.u)[V.pg];
  V.np = unitPages(V.u).length;
  if (P.k && !S.seen[P.k]) { S.seen[P.k] = 1; save(); }
  return `<div class="hud"><span class="chip">${U.n}</span><span class="ttl"></span><span class="pts">${V.pg + 1}/${V.np}</span></div>
  <div class="panel say scroll grow">${SP.sage(P.m)}<div class="ttl">${P.t}</div>${P.say}</div>
  <div class="tip"><b>A</b> ${V.pg < V.np - 1 ? 'siguiente' : 'terminar'} · <b>L R</b> página · <b>B</b> lista</div>`;
};
/* si nadie pasa la página en un buen rato, el sabio se queda dormido */
const doze = () => later(() => { const e = app.querySelector('.sage'); if (e) e.outerHTML = SP.sage('sleepy'); }, 45000);
AFTER.clases = doze;
AFTER.clase = () => { doze(); let n = 0; const iv = setInterval(() => { AU.blip('sage'); if (++n > 5) clearInterval(iv); }, 70); timers.push(iv); };
H.clase = {
  A() {
    if (V.pg < V.np - 1) { V.pg++; render(); return; }
    const u = V.u;
    S.units[u] = 1; save();
    award('student');
    if (Object.keys(S.units).length >= CLASES_DEF.length) award('scholar');
    AU.sfx.ok(); go('clases', { idx: u });
  },
  R() { if (V.pg < V.np - 1) { V.pg++; render(); } }, right() { H.clase.R(); },
  L() { if (V.pg > 0) { V.pg--; render(); } }, left() { H.clase.L(); },
  B() { AU.sfx.back(); go('clases', { idx: V.u }); }
};
LEG.clase = () => [['A', 'seguir'], ['L R', 'página'], ['↑↓', 'leer'], ['B', 'lista']];

/* ---------- perfil ---------- */
const galHTML = () => { const m = SP.moods[V.m || 0]; return `${bot(m)}<div class="moodn onbg">◂ ${SP.MOODS[m].n.toUpperCase()} ▸<br>${(V.m || 0) + 1}/${SP.moods.length}</div>`; };
R.perfil = () => {
  const rk = rank(), tot = S.t.right + S.t.wrong;
  const stat = (a, b) => `<div class="stat"><span>${a}</span><span>${b}</span></div>`;
  return `<div class="hud"><span class="chip">PERFIL</span><span class="ttl">SILO, tu robot lógico</span><span class="pts">${achN()}/${ACH.length} ★</span></div>
  <div class="prof"><div class="gal" id="gal">${galHTML()}</div>
  <div class="panel scroll">
    <div class="sec"><b>RANGO</b><span class="big">${rk.name}</span> · ${S.xp} XP${rk.next ? ` · faltan ${rk.next - S.xp} para ${rk.nextName}` : ''}<div class="xp"><i style="width:${rk.pct}%"></i></div></div>
    <div class="sec"><b>MARCAS</b>${stat('Aciertos', S.t.right)}${stat('Precisión', tot ? Math.round(100 * S.t.right / tot) + '%' : '—')}${stat('Mejor racha', '×' + S.t.streak)}${stat('«No es falacia» acertadas', S.t.ok)}${stat('Estrellas de aventura', totalStars() + '/12')}${stat('Falacidex', caughtN() + '/' + DEX.length)}${stat('Récord del torneo', S.best)}${stat('Récord de Relámpago', S.flash)}</div>
    <div class="sec"><b>LOGROS</b><div class="achs">${ACH.map(a => `<div class="ach${S.ach[a.k] ? ' on' : ''}"><span class="tr">${S.ach[a.k] ? '★' : '☆'}</span><div>${a.n}<small>${a.d}</small></div></div>`).join('')}</div></div>
  </div></div>
  <div class="tip"><b>◂ ▸</b> emociones de SILO · <b>↑↓</b> leer · <b>B</b> volver</div>`;
};
const moodStep = d => { V.m = ((V.m || 0) + d + SP.moods.length) % SP.moods.length; AU.sfx.move(); $('#gal').innerHTML = galHTML(); AU.blip('bot'); };
H.perfil = { left() { moodStep(-1); }, right() { moodStep(1); }, L() { moodStep(-1); }, R() { moodStep(1); }, A() { moodStep(1); }, B: backMenu };
LEG.perfil = () => [['◂ ▸', 'emoción'], ['↑↓', 'leer'], ['B', 'volver']];

/* ---------- opciones ---------- */
const meter = n => `<span class="vm end">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
R.opciones = () => {
  V.n = 5;
  return `<div class="hud"><span class="chip">OPCIONES</span><span class="ttl">Ajustes</span></div>
  <div class="list scroll grow">
    <div class="opt" data-i="0">Música${meter(S.mv)}</div>
    <div class="opt" data-i="1">Efectos${meter(S.sv)}</div>
    <div class="opt" data-i="2">Voz del texto<span class="end">${S.voice ? 'SÍ' : 'NO'}</span></div>
    <div class="opt" data-i="3">Cómo jugar</div>
    <div class="opt" data-i="4">${V.sure ? '¿Seguro? Pulsa A otra vez' : 'Borrar progreso'}</div>
  </div>
  <div class="tip"><b>◂ ▸</b> ajustar · <b>A</b> elegir · <b>B</b> volver</div>`;
};
function optAdj(d) {
  const i = V.idx;
  if (i === 0) S.mv = d ? Math.max(0, Math.min(5, S.mv + d)) : (S.mv + 1) % 6;
  else if (i === 1) S.sv = d ? Math.max(0, Math.min(5, S.sv + d)) : (S.sv + 1) % 6;
  else if (i === 2) S.voice = !S.voice;
  else return false;
  save(); applyVol(); render();
  if (i === 2) AU.blip('bot'); else AU.sfx.ok();
  return true;
}
H.opciones = {
  left() { optAdj(-1); }, right() { optAdj(1); },
  A() {
    if (optAdj(0)) return;
    if (V.idx === 3) { AU.sfx.ok(); go('help'); return; }
    if (!V.sure) { V.sure = true; AU.sfx.no(); render(); return; }
    Object.assign(S, FRESH()); save();
    V.sure = false; toast('Progreso borrado', 'LISTO'); render();
  },
  up() { if (V.sure) { V.sure = false; render(); } nav('up'); }, down() { if (V.sure) { V.sure = false; render(); } nav('down'); },
  B: backMenu
};
LEG.opciones = () => [['◂ ▸', 'ajustar'], ['A', 'elegir'], ['B', 'volver']];
R.help = () => `<div class="hud"><span class="chip">AYUDA</span><span class="ttl">Cómo jugar</span></div>
  <div class="panel scroll grow">
    <div class="sec"><b>OBJETIVO</b>Lee el argumento y elige qué falacia comete. Si es un argumento legítimo, elige <u>No es falacia</u>.</div>
    <div class="sec"><b>PUNTOS</b>100 por acierto, más bonus por racha. La pista cuesta 50 y el 50/50 cuesta 30. No hay límite de tiempo: piensa cada respuesta con calma.</div>
    <div class="sec"><b>VIDAS</b>Cada error cuesta una vida, pero te explica por qué falla y cuál es su «primo legítimo». Lo que falles vuelve una vez al final.</div>
    <div class="sec"><b>TECLADO</b>Flechas: mover · Z o Intro: A · X o Esc: B · A y S: L y R · Retroceso: SELECT (pista) · P: START (pausa) · 1 a 4: responder · M: silenciar</div>
    <div class="sec"><b>LO IMPORTANTE</b>Una falacia es un problema de <u>apoyo</u>, no de conclusión. El objetivo no es acusar mucho: es acusar bien.</div>
    <div class="sec"><b>CONTENIDO</b>${QS.length + BOSS.length} desafíos, ${DEX.length - 1} falacias y ${CLASES_DEF.reduce((n, c, i) => n + unitPages(i).length, 0)} páginas de clases.</div>
  </div><div class="tip"><b>B</b> volver · <b>↑↓</b> leer</div>`;
H.help = { A() { AU.sfx.back(); go('opciones', { idx: 3 }); }, B() { AU.sfx.back(); go('opciones', { idx: 3 }); } };
LEG.help = () => [['↑↓', 'leer'], ['B', 'volver']];

/* ---------- entrada ---------- */
document.querySelectorAll('.pad [data-pad]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(b.dataset.pad); });
});
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => AU.unlock(), true));
const TAP = { title: 1, lesson: 1, feedback: 1, clase: 1 };
app.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](); return; }
  const el = e.target.closest('[data-i]');
  if (lock) { lock(); return; }
  if (el && !(V.scr === 'quiz' && V.typing)) {
    if (el.classList.contains('cut')) return;
    V.idx = +el.dataset.i; hl(); press('A'); return;
  }
  if (TAP[V.scr] || (V.scr === 'quiz' && V.typing)) { if (!e.target.closest('.scroll') || V.scr !== 'feedback') press('A'); }
});
mbtn.addEventListener('click', () => { AU.unlock(); toggleMute(); AU.sfx.ok(); });
const KEY = { arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right', z: 'A', enter: 'A', ' ': 'A', x: 'B', escape: 'B', a: 'L', s: 'R', p: 'start', backspace: 'select', h: 'select' };
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { AU.unlock(); toggleMute(); return; }
  if ('1234'.includes(k) && k.length === 1 && V.scr === 'quiz' && !V.typing && !lock) {
    const i = +k - 1;
    if (i < V.opts.length && !V.cut.includes(i)) { e.preventDefault(); V.idx = i; hl(); answer(); }
    return;
  }
  const b = KEY[k];
  if (!b) return;
  e.preventDefault();
  if (e.repeat && !DIRS.includes(b)) return;
  press(b);
  const el = document.querySelector(`.pad [data-pad="${b}"]`);
  if (el) { el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 90); }
});
document.addEventListener('contextmenu', e => { if (e.target.closest('.gba')) e.preventDefault(); });
let fitT = null;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { fit(); hl(); more(); }, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); more(); });

/* icono de pestaña: la cara de SILO */
try {
  const link = document.createElement('link');
  link.rel = 'icon';
  link.href = SP.url('happy');
  document.head.appendChild(link);
} catch (e) { /* sin icono */ }

applyVol();
window.FalaciaAdvance = { go, render, press, answer, startRun, startFlash, skipType, TORNEOS, state: () => V, run: () => run, flash: () => F, save: S, QS, FAL, DEX, FLASHES, robot: SP.robot };
render();
})();

</script>
<!--/BODY-->
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
